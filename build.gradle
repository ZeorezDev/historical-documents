plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

group = 'dev.zeorez.historicaldocuments'
version = '0.2.0'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

def coreFilename = 'historical_nations-0.2.0.jar'
def coreJar = file(findProperty('coreJar') ?: "libs/${coreFilename}")
if (!coreJar.isFile() && !hasProperty('coreJar')) {
    coreJar = file("../historicalnationscore/build/libs/${coreFilename}")
}
if (!coreJar.isFile()) throw new GradleException("Historical Nations Core v0.2.0 required. Supply -PcoreJar=<path to ${coreFilename}>")

sourceSets {
    integration {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
}
minecraft {
    mappings channel: 'official', version: '1.20.1'
}

def testClient = findProperty('documentTestClient')
if (testClient) {
    if (!(testClient in ['DocWriter', 'DocReader'])) throw new GradleException('Expected DocWriter or DocReader')
    repositories {
        flatDir { dirs coreJar.parentFile }
        exclusiveContent {
            forRepository { maven { url = 'https://chocolateminecraft.com/maven' } }
            filter { includeGroup 'xaero.pac' }
        }
    }
    dependencies {
        runtimeOnly fg.deobf('local:historical_nations:0.2.0')
        runtimeOnly 'xaero.pac:open-parties-and-claims-forge-1.20.1:0.33.0:dev'
    }
    minecraft.runs {
        client {
            workingDirectory project.file("run-${testClient}")
            mods {
                historical_documents { source sourceSets.main }
                historical_document_tests { source sourceSets.integration }
            }
            property 'documents.client', testClient
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', project.file('build/createSrgToMcp/output.srg').absolutePath
            args '--username', testClient, '--width', '640', '--height', '480'
            jvmArgs '-Xmx1536M', '-XX:ActiveProcessorCount=3'
        }
    }
    tasks.matching { it.name == 'runClient' }.configureEach { dependsOn 'integrationClasses', 'createSrgToMcp' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.28'
    // Core's public API uses stable class names and has no mapped vanilla method calls.
    compileOnly files(coreJar)
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
jar.finalizedBy 'reobfJar'

tasks.register('integrationJar', Jar) {
    from sourceSets.integration.output
    archiveBaseName = 'historical-documents-tests'
    destinationDirectory = layout.buildDirectory.dir('integration')
}
reobf { integrationJar {} }
tasks.named('integrationJar') { finalizedBy 'reobfIntegrationJar' }
